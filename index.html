:root{color-scheme:dark;--bg:#0a0608;--panel:#16090d;--glass:rgba(32,12,17,.66);--line:rgba(255,255,255,.13);--fg:#fff;--muted:#beb0b2;--red:#e11d2e;--deep:#7a0612;--gold:#f2d49e;--gold-hi:#fff1d6;--gold-lo:#e8c080;--ink:#140a0c;--brand:#3d2025;--head:"Druk SH","Arial Narrow",Impact,sans-serif;--text:"Inter SH","Segoe UI",system-ui,sans-serif;--r:24px;--r-sm:16px;--gut:clamp(16px,4vw,40px);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:500 16px/1.5 var(--text);overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(70vmax 56vmax at 50% 0,rgba(225,29,46,.4),transparent 62%),radial-gradient(60vmax 50vmax at 92% 75%,rgba(122,6,18,.6),transparent 65%),radial-gradient(52vmax 44vmax at 4% 96%,rgba(61,32,37,.9),transparent 66%),var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;opacity:.4;mask-image:linear-gradient(#000,rgba(0,0,0,.3))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block;max-width:100%}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{width:100%;max-width:1160px;margin:0 auto;padding-inline:max(var(--gut),env(safe-area-inset-left,0px))}
.h{font-family:var(--head);font-weight:700;text-transform:uppercase;line-height:.96;letter-spacing:0}
.red{color:var(--red)}.gold{color:var(--gold)}.muted{color:var(--muted)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px}
.logo{width:clamp(120px,22vw,170px);height:auto;background:none}
.lang{display:flex;padding:3px;border:1px solid var(--line);border-radius:99px;background:var(--glass);backdrop-filter:blur(10px)}
.lang button{min-width:52px;min-height:44px;border:0;border-radius:99px;background:transparent;color:var(--muted);font-weight:700;font-size:14px;transition:background .25s,color .25s}
.lang button[aria-pressed=true]{background:var(--gold);color:var(--ink)}

/* hero */
.hero{padding-block:clamp(20px,5vw,56px) 12px}
.hero h1{font-size:clamp(64px,15vw,168px);margin-bottom:18px}
.hero p{max-width:52ch;color:var(--muted);font-size:clamp(16px,2.2vw,19px)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.stat{padding:12px 18px;border:1px solid var(--line);border-radius:99px;background:var(--glass);backdrop-filter:blur(10px);font-weight:700;font-size:14px}
.stat b{color:var(--gold);font-size:18px;margin-right:6px}

/* filters */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-block:34px 8px}
.chip{min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:99px;background:var(--glass);color:var(--muted);font-weight:700;font-size:14px;transition:background .25s,color .25s,border-color .25s}
.chip:hover{border-color:var(--gold);color:var(--fg)}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.search{margin-left:auto;min-height:44px;width:min(100%,260px);padding:0 18px;border:1px solid var(--line);border-radius:99px;background:var(--glass);color:var(--fg);font:500 14px var(--text)}
.search::placeholder{color:var(--muted)}

/* year groups + cards */
.year{display:flex;align-items:baseline;gap:14px;margin:38px 0 16px}
.year h2{font-size:clamp(44px,8vw,84px)}
.year span{color:var(--muted);font-weight:700;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:340px;padding:22px;border-radius:var(--r);border:1px solid rgba(255,255,255,.18);overflow:hidden;background:radial-gradient(120% 100% at 25% 5%,var(--red),var(--deep) 56%,var(--brand));box-shadow:0 20px 50px rgba(0,0,0,.45);transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.card:hover{transform:translateY(-6px);box-shadow:0 28px 64px rgba(225,29,46,.3)}
.card:active{transform:scale(.98)}
.card::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(#000,transparent 80%)}
.card .no{position:absolute;top:10px;right:18px;font-family:var(--head);font-weight:700;font-size:150px;line-height:1;color:rgba(255,255,255,.11);pointer-events:none}
.card .tag{position:relative;align-self:flex-start;padding:6px 12px;border-radius:99px;background:rgba(10,6,8,.55);border:1px solid rgba(255,255,255,.22);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:12px}
.card h3{position:relative;font-size:clamp(34px,5vw,46px);margin-bottom:10px}
.card .meta{position:relative;display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--gold-hi);font-size:14px;font-weight:700}
.card.has-cover{background:#120609}
.card .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.card.has-cover:hover .cover{transform:scale(1.05)}
.card.has-cover::before{background:linear-gradient(180deg,rgba(10,6,8,.1) 0%,rgba(10,6,8,.35) 40%,rgba(10,6,8,.92) 100%);mask-image:none}
.card.has-cover .no{display:none}
.card.wide{grid-column:1/-1;min-height:min(62vw,520px)}
.card.wide h3{font-size:clamp(38px,6.4vw,76px);max-width:16ch}
.ecover{position:relative;margin-top:14px;border-radius:var(--r);overflow:hidden;aspect-ratio:21/9;min-height:220px;border:1px solid rgba(255,255,255,.18);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.ecover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ecover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(10,6,8,.85))}
.ecover .badge{position:absolute;z-index:2;left:20px;bottom:18px;display:flex;flex-wrap:wrap;gap:8px}
.ecover .badge span{padding:7px 14px;border-radius:99px;background:rgba(10,6,8,.6);border:1px solid rgba(255,255,255,.25);font-weight:700;font-size:13px;color:var(--gold-hi);backdrop-filter:blur(8px)}
.card .go{position:relative;margin-top:16px;display:inline-flex;align-items:center;gap:8px;color:var(--gold);font-weight:700}
.empty{padding:40px 0;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 24px;border-radius:99px;border:0;background:linear-gradient(100deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));color:var(--ink);font-weight:700;font-size:16px;box-shadow:0 12px 40px rgba(242,212,158,.24),inset 0 1px 0 rgba(255,255,255,.7);transition:transform .25s var(--ease),box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 18px 48px rgba(242,212,158,.4),inset 0 1px 0 rgba(255,255,255,.7)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--glass);color:var(--fg);border:1px solid var(--line);box-shadow:none;backdrop-filter:blur(10px)}
.btn.sm{min-height:40px;padding:8px 16px;font-size:14px}
.btn svg{width:18px;height:18px;flex:none}

.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;margin-top:8px;color:var(--gold);font-weight:700}
.ehead{padding-block:18px 8px}
.ehead h1{font-size:clamp(52px,11vw,132px);margin:14px 0}
.ehead .tag{display:inline-block;padding:6px 14px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold)}
.ehead p{max-width:60ch;color:var(--muted)}
.sec{margin-top:40px}
.sec>h2{font-size:clamp(36px,6vw,64px);margin-bottom:16px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.vid{position:relative;aspect-ratio:16/9;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:radial-gradient(120% 120% at 30% 0,var(--brand),#120609);cursor:pointer;display:block;width:100%;padding:0;text-align:left}
.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid::after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.78))}
.vid .play{position:absolute;z-index:2;left:50%;top:44%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(10,6,8,.62);border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;transition:transform .3s var(--ease),background .3s}
.vid:hover .play{transform:scale(1.12);background:var(--red)}
.vid .play svg{width:20px;height:20px;margin-left:3px;fill:#fff}
.vid .cap{position:absolute;z-index:2;left:12px;right:12px;bottom:10px;display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}
.vid .cap small{color:var(--gold);font-weight:700;font-size:12px}
.soon{position:absolute;z-index:2;top:10px;left:10px;padding:4px 10px;border-radius:99px;background:rgba(10,6,8,.6);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.files{display:grid;gap:8px}
.file{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--glass);backdrop-filter:blur(10px)}
.file .n{display:flex;flex-direction:column;min-width:0}
.file .n b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .n small{color:var(--muted);font-size:12px}
.file .a{display:flex;gap:8px;flex:none}
.note{margin-top:14px;padding:14px 18px;border:1px dashed rgba(242,212,158,.4);border-radius:var(--r-sm);color:var(--gold-hi);font-size:14px}

.modal.on{display:flex}
.modal .box{width:min(1100px,100%)}
.modal video{width:100%;max-height:78vh;border-radius:var(--r-sm);background:#000}
.modal .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-weight:700}

footer .wrap{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center}
footer .links{display:flex;flex-wrap:wrap;gap:10px}
footer small{display:block;width:100%;color:var(--muted);font-size:13px}

.play-in{animation:rise .7s var(--ease) both}
@keyframes rise{from{opacity:0;translate:0 24px}to{opacity:1;translate:0 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function home(){
  var tx = t(), types = ["all"];

  h += '<section class="sec"><h2 class="h">' + esc(tx.filesH) + '</h2><div class="files">';
  e.files.forEach(function(f){
    h += '<div class="file"><div class="n"><b>' + esc(f.v) + '</b><small>' + esc((f.v.split('.').pop() || 'MP4').toUpperCase()) + (f.x ? ' · ' + esc(f.x) + ' (' + esc(tx.meta) + ')' : '') + '</small></div><div class="a">' +
      (CDN ? '<a class="btn sm" href="' + origUrl(e, f) + '" download="' + esc(f.v) + '">' + ICON_DL + esc(tx.dl) + '</a>' : '<span class="soon" style="position:static">' + esc(tx.soon) + '</span>') + '</div></div>';
  });
  return h + '</div></section></main>' + foot();
}

function render(){
  var id = (location.hash || "").slice(1), e = EVENTS.filter(function(x){ return x.id === id; })[0];
  document.documentElement.lang = lang;
  var app = document.getElementById("app");
  app.innerHTML = e ? eventPage(e) : home();
  document.title = (e ? evTitle(e) + " — " : "") + "SHABYT EVENT";
  if (!e) { var s = document.getElementById("q"); if (s) s.addEventListener("input", function(){ q = s.value; var p = s.selectionStart; render(); var n = document.getElementById("q"); n.focus(); try { n.setSelectionRange(p, p); } catch (x) {} }); }
}

document.addEventListener("click", function(ev){
  var l = ev.target.closest("[data-l]"); if (l) { lang = l.getAttribute("data-l"); try { sessionStorage.setItem("sh-lang", lang); } catch (e) {} render(); return; }
  var f = ev.target.closest("[data-f]"); if (f) { filter = f.getAttribute("data-f"); render(); return; }
  var v = ev.target.closest(".vid"); if (v) {
    var e = EVENTS.filter(function(x){ return x.id === (location.hash || "").slice(1); })[0]; if (!e) return;
    var file = e.files[+v.getAttribute("data-i")];
    if (file.photo) { var mi = document.getElementById("mimg"); document.getElementById("mvideo").hidden = true; mi.hidden = false; mi.src = origUrl(e, file);
      document.getElementById("mtitle").textContent = file.v; var d2 = document.getElementById("mdl"); d2.href = origUrl(e, file); d2.setAttribute("download", file.v); d2.innerHTML = ICON_DL + esc(t().dl); d2.hidden = false; document.getElementById("modal").classList.add("on"); return; }
    document.getElementById("mimg").hidden = true; document.getElementById("mvideo").hidden = false;
    var u = webUrl(e, file); if (!u) return;
    var m = document.getElementById("modal"), vid = document.getElementById("mvideo");
    document.getElementById("mtitle").textContent = file.v; vid.poster = posterUrl(e, file); vid.src = u; var dl = document.getElementById("mdl"); dl.href = origUrl(e, file); dl.setAttribute("download", file.v); dl.innerHTML = ICON_DL + esc(t().dl); dl.hidden = false; m.classList.add("on");
    var pr = vid.play(); if (pr && pr.catch) pr.catch(function(){});
  }
});
function closeModal(){ var m = document.getElementById("modal"), vid = document.getElementById("mvideo"), mi = document.getElementById("mimg"); mi.hidden = true; mi.removeAttribute("src"); vid.pause(); vid.removeAttribute("src"); vid.removeAttribute("poster"); vid.load(); m.classList.remove("on"); }
document.getElementById("mclose").addEventListener("click", closeModal);
document.getElementById("modal").addEventListener("click", function(ev){ if (ev.target === this) closeModal(); });
document.addEventListener("keydown", function(ev){ if (ev.key === "Escape") closeModal(); });
window.addEventListener("hashchange", function(){ closeModal(); render(); window.scrollTo(0, 0); });
render();
</script>
</body>
</html>
